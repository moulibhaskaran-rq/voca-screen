<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE614;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC700;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="180" height="180" rx="40" fill="url(#yellowGrad)"/>

  <!-- Microphone icon (scaled up) -->
  <g transform="translate(56, 34)" filter="url(#glow)">
    <!-- Microphone capsule -->
    <rect x="17" y="0" width="34" height="50" rx="17" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="4"/>

    <!-- Microphone stand curve -->
    <path d="M 34 50 L 34 68 M 17 78 L 51 78 M 34 68 L 34 78" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Sound waves -->
    <path d="M 0 34 Q 0 17, 8 17" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 68 34 Q 68 17, 60 17" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 0 34 Q 0 50, 8 50" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 68 34 Q 68 50, 60 50" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>
